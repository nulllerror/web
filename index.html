<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somto's website</title>

    <link rel="icon" type="image/png" href="thumbnail.png">
    <link rel="apple-touch-icon" href="thumbnail.png">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="background-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <main class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-content">
                <h1 class="reveal">Somtochukwu Emeka-Obi</h1>
                <div class="sidebar-socials reveal">
                    <a href="https://github.com/nulllerror" target="_blank"><i class="fab fa-github"></i></a>

                </div>
                <p class="sidebar-footer">&copy; Crafted with love.</p>
            </div>
        </aside>

        <section class="main-content">
            <div class="right-panel glass-card reveal">
                <div class="hero-text">
                    <p class="subtitle">
                        <span id="typewriter"></span><span class="cursor">|</span>
                    </p>
                </div>

                <div id="about" class="section-box">
                    <h2 class="section-title">About Me</h2>
                    <div class="about-card-inline">
                        <p>Currently a 3rd year student, I enjoy turning complex problems into efficient code. Specializing in full-stack development and system architecture, with numerous personal projects.</p>
                    </div>
                </div>

                <div id="skills" class="section-box">
                    <h2 class="section-title">Skills</h2>
                    <div class="skills-cloud" id="skills-cloud"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
